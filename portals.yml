search_queries:
  # === Ashby ===
  - name: Ashby - DevOps SRE LATAM
    query: 'site:jobs.ashbyhq.com "DevOps Engineer" OR "Site Reliability Engineer" OR "SRE" remote OR LATAM'
    enabled: true
  - name: Ashby - Cloud Platform LATAM
    query: 'site:jobs.ashbyhq.com "Cloud Engineer" OR "Platform Engineer" OR "Infrastructure Engineer" remote OR LATAM'
    enabled: true
  - name: Ashby - Cloud Architect TPM
    query: 'site:jobs.ashbyhq.com "Cloud Architect" OR "Solutions Architect" OR "Technical Project Manager" remote'
    enabled: true
  - name: Ashby - Leadership Management
    query: 'site:jobs.ashbyhq.com "Engineering Manager" OR "Head of Technology" OR "Technical Program Manager" OR "Infrastructure Manager" remote OR LATAM'
    enabled: true
  - name: Ashby - Technical Delivery Product Ops
    query: 'site:jobs.ashbyhq.com "Technical Project Manager" OR "Technical Program Manager" OR "Delivery Manager" OR "Product Lead" OR "Product Operations Manager" remote OR LATAM'
    enabled: true
