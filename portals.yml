  - name: Greenhouse - Technical Delivery Product Ops
    query: 'site:job-boards.greenhouse.io OR site:boards.greenhouse.io "Technical Project Manager" OR "Technical Program Manager" OR "Delivery Manager" OR "Product Lead" OR "Product Operations Manager" remote OR LATAM'
